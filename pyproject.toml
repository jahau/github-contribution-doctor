[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-contribution-doctor"
version = "0.2.0"
description = "Read-only diagnostics for Git commits that are missing from a GitHub contribution graph."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "GitHub Contribution Doctor contributors" }]
keywords = ["git", "github", "contributions", "diagnostics", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
contribution-doctor = "contribution_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/jahau/github-contribution-doctor"
Issues = "https://github.com/jahau/github-contribution-doctor/issues"
Changelog = "https://github.com/jahau/github-contribution-doctor/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contribution_doctor = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "PT", "RUF"]
ignore = [
    "S603",  # subprocess calls are intentional; arguments are lists, never shell strings
    "S607",  # git/gh are resolved via shutil.which
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
